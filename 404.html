<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Dheepak</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 8rem;
            margin-bottom: var(--space-4);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2 style="margin-bottom: var(--space-6);">Oops! Looks like you're lost.</h2>
        <p style="margin-bottom: var(--space-8);">The page you are looking for does not exist or has been moved.</p>
        <a href="index.html" class="btn btn--primary btn--lg">Return Home</a>
    </div>
</body>
</html>
